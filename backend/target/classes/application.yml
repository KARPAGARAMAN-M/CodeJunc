server:
  port: ${PORT:${SERVER_PORT:8080}}

codejunc:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  rate-limit:
    enabled: true
    requests-per-minute: 30

judge0:
  base-url: ${JUDGE0_BASE_URL:https://ce.judge0.com}
  api-key: ${JUDGE0_API_KEY:}
  api-host: ${JUDGE0_API_HOST:}
  connect-timeout-ms: 10000
  read-timeout-ms: 30000
  poll-interval-ms: 800
  poll-max-attempts: 40
  cpu-time-limit: 10.0
  wall-time-limit: 15.0
  memory-limit: 512000
  java-memory-limit: 512000
  # Verified fast language IDs for Judge0 CE (1.14.0)
  languages:
    c: 103
    cpp: 105
    java: 91
    python: 92
    javascript: 93

logging:
  level:
    com.codejunc: INFO
    org.springframework.web: WARN
