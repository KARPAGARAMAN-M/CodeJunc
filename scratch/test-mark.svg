<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="320" height="240" fill="none">
  <defs>
    <linearGradient id="cj-grad-c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
    <linearGradient id="cj-grad-arrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cj-grad-j" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background for preview check -->
  <rect width="160" height="120" fill="#0D1117" rx="12" />

  <g transform="translate(10, 10)">
    <!-- Letter C -->
    <!-- Center (42, 50), outer radius 34, stroke 14 -->
    <path
      d="M 64 28
         A 34 34 0 1 0 64 72"
      stroke="url(#cj-grad-c)"
      stroke-width="14"
      stroke-linecap="butt"
      stroke-linejoin="round"
    />

    <!-- X Junction & J & Arrow -->
    <!-- Stroke going up-right into Arrow -->
    <path
      d="M 50 78 L 105 23"
      stroke="url(#cj-grad-arrow)"
      stroke-width="13"
      stroke-linecap="square"
    />

    <!-- Arrowhead pointing up-right at (105, 23) -->
    <polygon
      points="88,20 122,14 116,48 107,35 97,45 87,35 97,25"
      fill="#F59E0B"
    />

    <!-- Stroke going down-right crossing into J -->
    <path
      d="M 48 24 L 80 56 L 106 56"
      stroke="url(#cj-grad-c)"
      stroke-width="13"
      stroke-linecap="square"
    />
  </g>
</svg>
