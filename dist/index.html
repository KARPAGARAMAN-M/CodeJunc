<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" id="theme-color" content="#0D1117" />
    <title>CodeJunc — Code Without Distractions</title>
    <meta
      name="description"
      content="A premium, minimal, distraction-free online coding workspace with dark and light themes."
    />

    <!-- CodeJunc Brand Favicons & Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/brand/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/brand/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/brand/apple-touch-icon.png" />

    <!-- Fonts: Inter, JetBrains Mono & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Initial Theme Detection (Instant zero flicker) -->
    <script>
      (function () {
        try {
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isWelcome = window.location.pathname === '/' || window.location.pathname === '';
          var saved = localStorage.getItem('cj.theme');
          var theme;
          if (isWelcome) {
            // Welcome page theme is strictly based on the system's theme
            theme = systemDark ? 'dark' : 'light';
          } else if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else {
            // Automatically follow OS preference: Light or Dark mode (never custom themes automatically)
            theme = systemDark ? 'dark' : 'light';
            if (saved === 'crimson-forge' || saved === 'united') {
              localStorage.removeItem('cj.theme');
            }
          }
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.getElementById('theme-color');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#0D1117' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-D9oqakES.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-aqocGfXw.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
